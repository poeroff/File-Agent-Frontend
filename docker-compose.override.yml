# Development-only overrides. Compose merges this automatically on top of
# docker-compose.yml whenever you run `docker compose up` without -f.
# This is what switches the container to `next dev` with hot reload — do NOT
# use this for a real deployment. For a production run, see the -f command
# noted at the top of docker-compose.yml.
services:
  client:
    build:
      target: dev
    # Turbopack's native file watcher doesn't see changes through Docker
    # Desktop's Windows bind mount, so fall back to webpack + polling for dev.
    command: ["pnpm", "exec", "next", "dev", "--webpack"]
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
