# Reverse proxy in front of the Next.js frontend.
# Public traffic: Tailscale Funnel -> this Nginx (host port) -> client:3000.

# WebSocket upgrade passthrough (Next.js HMR / any live connections).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Preserve the original protocol: if an upstream proxy (Tailscale Funnel) already
# set X-Forwarded-Proto (https), keep it; otherwise fall back to our scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    # Files stream through Next.js, so don't cap the upload body size.
    client_max_body_size 0;

    location / {
        proxy_pass http://client:3000;
        proxy_http_version 1.1;

        # Let NextAuth see the real external host + https so OAuth callbacks
        # and cookies are built correctly.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Don't buffer, so large uploads/streamed responses pass straight through.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
