# Production base config — builds the `runner` stage (next build + next start).
# Run this alone with: docker compose -f docker-compose.yml up -d --build
#
# For local development, don't run this file by itself — just use
# `docker compose up -d --build` (no -f flag), which auto-merges
# docker-compose.override.yml on top and switches to the dev stage
# with hot reload instead.
services:
  client:
    build:
      context: ./client
    env_file:
      - .env
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    restart: unless-stopped

  # Reverse proxy that fronts the Next.js app. This is the public entrypoint —
  # point Tailscale Funnel at NGINX_PORT (default 8080):
  #   tailscale funnel --bg 8080
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
    restart: unless-stopped
